{% extends 'base.html' %}
{% block title %}Edit Student | stuAtt{% endblock %}
{% block content %}
<header>
            <h1>Edit Student</h1>
            <p>Update student information.</p>
        </header>

        <section class="form-card">
            <h2>Student Details</h2>

            <form method="POST">
                <label for="name">Student Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ student[0] }}"
                    required
                >

                <label for="roll_number">Roll Number</label>
                <input
                    type="text"
                    id="roll_number"
                    value="{{ student[1] }}"
                    disabled
                >

                <label for="course">Course</label>
                <input
                    type="text"
                    id="course"
                    name="course"
                    value="{{ student[2] }}"
                    required
                >

                <label for="semester">Semester</label>
                <input
                    type="number"
                    id="semester"
                    name="semester"
                    value="{{ student[3] }}"
                    min="1"
                    required
                >

                <button type="submit">Save Changes</button>
                <a href="/students" class="clear-filter">Cancel</a>
            </form>
        </section>
{% endblock %}
