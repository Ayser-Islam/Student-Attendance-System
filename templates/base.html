
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}stuAtt{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="sidebar">
        <h2>stuAtt</h2>
        <p class="sidebar-subtitle">Student Management</p>

        <nav aria-label="Main navigation">
            <a href="{{ url_for('home') }}"
               class="{% if request.path == '/' %}active{% endif %}">
                Dashboard
            </a>

            <a href="{{ url_for('students_page') }}"
               class="{% if request.path.startswith('/students') %}active{% endif %}">
                Students
            </a>

            <a href="{{ url_for('attendance') }}"
               class="{% if request.path == '/attendance' %}active{% endif %}">
                Mark Attendance
            </a>

            <a href="{{ url_for('records') }}"
               class="{% if request.path.startswith('/records') %}active{% endif %}">
                Attendance Records
            </a>

            <a href="{{ url_for('logout') }}">
                Logout
            </a>
        </nav>
    </div>

    <main class="main-content" id="main-content">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
